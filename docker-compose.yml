# Full stack: Prism API + static UI (nginx).
#
#   docker compose up --build
#
# URLs:
#   UI   → http://localhost:8080
#   API  → http://localhost:3000
#
# Prerequisites:
#   - Copy `.env.example` to `.env` and set `ALLOWED_API_KEY`, Redis, and at least one of
#     `GROQ_API_KEY` / `GEMINI_API_KEY`. Compose mounts `.env` into the API container.
#
# Browser vs Docker networking:
#   The UI is built with VITE_API_BASE_URL=http://localhost:3000 so the *browser* talks to the API
#   on your host. If you publish the API on another host/port, rebuild:
#     docker compose build --build-arg VITE_API_BASE_URL=https://api.example.com frontend

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
